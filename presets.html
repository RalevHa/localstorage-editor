<!doctype html>
<meta charset="utf-8">
<title>Presets</title>
<style>
  :root { --bg: #14171c; --card: #1c2027; --line: #2a303a; --text: #e6e9ee; --muted: #8b94a3; --accent: #34d399; --accent-ink: #052e1f; color-scheme: dark }
  * { box-sizing: border-box }
  body { max-width: 560px; margin: 0 auto; padding: 20px; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif }
  h1 { font-size: 15px; margin: 0 0 4px }
  #sub { color: var(--muted); font-size: 12px; margin-bottom: 14px; display: flex; gap: 12px; align-items: center }
  #sub label { cursor: pointer; display: flex; gap: 4px; align-items: center }
  input[type=checkbox] { accent-color: var(--accent) }
  .row { display: flex; align-items: center; gap: 10px; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; margin-bottom: 8px }
  .path { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600 }
  .val { color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap }
  button { font: inherit; cursor: pointer; border-radius: 8px; border: 1px solid var(--accent); background: transparent; color: var(--accent); padding: 4px 12px }
  button:hover { background: var(--accent); color: var(--accent-ink) }
  button.x { border-color: var(--line); color: var(--muted); padding: 4px 8px }
  #msg { color: var(--muted); font-size: 12px; margin-top: 8px; min-height: 1.4em }
</style>
<h1 id="title"></h1>
<div id="sub"><button id="refresh">↻</button><label><input id="rl" type="checkbox" checked> reload หน้าเกมหลังกด</label></div>
<div id="list"></div>
<div id="msg"></div>
<script src="shared.js"></script>
<script src="presets.js"></script>
