<!doctype html>
<meta charset="utf-8">
<style>
  :root {
    --bg: #14171c; --card: #1c2027; --line: #2a303a; --text: #e6e9ee; --muted: #8b94a3;
    --accent: #34d399; --accent-ink: #052e1f; --field: #11141a;
    color-scheme: dark;
  }
  * { box-sizing: border-box }
  body { width: 580px; margin: 0; background: var(--bg); color: var(--text); font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif }
  header { display: flex; gap: 8px; align-items: center; padding: 10px; position: sticky; top: 0; z-index: 1; background: var(--bg); border-bottom: 1px solid var(--line) }
  select, input[type=search], input[type=text], #fbar input, input[type=number], textarea {
    background: var(--field); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; font: inherit; outline: none
  }
  select:focus, input:focus, textarea:focus { border-color: var(--accent) }
  header select { flex: 1; min-width: 0; max-width: 200px }
  header input[type=search] { flex: 1; min-width: 0 }
  header label { display: flex; align-items: center; gap: 4px; color: var(--muted); cursor: pointer; white-space: nowrap }
  input[type=checkbox] { accent-color: var(--accent); width: 15px; height: 15px }
  #body { max-height: 430px; overflow: auto; padding: 10px; display: grid; gap: 8px }
  details { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 0 10px }
  details[open] { padding-bottom: 8px }
  summary { cursor: pointer; font-weight: 600; padding: 9px 0; list-style: none; display: flex; align-items: center; gap: 8px }
  summary::before { content: "▸"; color: var(--muted); transition: transform .15s }
  details[open] > summary::before { transform: rotate(90deg) }
  summary small { margin-left: auto; font-weight: 500; color: var(--muted); background: var(--field); border-radius: 99px; padding: 1px 8px }
  .row { display: flex; align-items: center; gap: 10px; padding: 3px 0 }
  .row span { flex: 0 0 180px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
  .row input[type=number], .row input[type=text] { flex: 1; min-width: 0; padding: 4px 8px }
  .row input.name { flex: 0 0 180px; color: var(--muted) }
  .row input[type=number] { text-align: right; font-variant-numeric: tabular-nums }
  .all { background: color-mix(in srgb, var(--accent) 10%, transparent); border-radius: 8px; padding: 6px 8px; margin-bottom: 6px }
  .add { border-top: 1px dashed var(--line); margin-top: 6px; padding-top: 8px }
  .all span { color: var(--accent) }
  .all input { flex: 0 0 90px !important }
  .all button, .add button { background: transparent; color: var(--accent); border: 1px solid var(--accent); border-radius: 8px; padding: 4px 10px; font: inherit; cursor: pointer }
  .all button:hover, .add button:hover { background: var(--accent); color: var(--accent-ink) }
  #tw { position: relative; margin: 10px; background: var(--field); border-radius: 8px }
  #text { display: block; width: 100%; height: 430px; background: transparent; font: 12px/1.5 ui-monospace, Menlo, monospace; resize: none; position: relative }
  /* twin behind the textarea: same font/wrap, transparent text, only the <mark> backgrounds show */
  #hl { position: absolute; top: 1px; left: 1px; overflow: hidden; padding: 6px 10px; box-sizing: border-box; font: 12px/1.5 ui-monospace, Menlo, monospace; white-space: pre-wrap; overflow-wrap: break-word; color: transparent; pointer-events: none }
  #hl mark { background: rgba(250, 204, 21, .5); color: transparent; border-radius: 2px }
  footer { padding: 10px; position: sticky; bottom: 0; background: var(--bg); border-top: 1px solid var(--line) }
  #tools { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 8px }
  #diff { max-height: 110px; overflow: auto; margin-bottom: 8px; padding: 6px 8px; background: var(--field); border: 1px solid var(--line); border-radius: 8px; font: 11px/1.5 ui-monospace, Menlo, monospace; white-space: pre-wrap; overflow-wrap: anywhere }
  #diff .pos { color: var(--accent) }
  #diff .neg { color: #f87171 }
  #fnav { display: flex; gap: 4px }
  #msg { color: var(--muted); font-size: 12px }
  .ghost { background: transparent !important; color: var(--text) !important; border: 1px solid var(--line) !important; width: auto !important; padding: 5px 12px !important; font: 500 12px system-ui !important }
  .ghost:hover { border-color: var(--accent) !important }
  #actions { display: flex; gap: 8px }
  #actions button { flex: 1 }
  footer button { width: 100%; padding: 10px; border: 0; border-radius: 10px; background: var(--accent); color: var(--accent-ink); font: 600 14px system-ui; cursor: pointer }
  footer button:hover { filter: brightness(1.1) }
  #fbar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 8px 10px 0 }
  #fbar input { padding: 3px 8px }
  #pbar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 6px 10px 0 }
  #pbar:not(:has(.chip, #pedit:not(.hide))) { display: none }
  #plist, #pedit { display: contents }
  #pbar input { width: 80px; padding: 3px 8px }
  #pbar select { padding: 3px 8px }
  #ppath { color: var(--accent); font-weight: 600 }
  #fk { width: 230px }
  #fv { width: 110px }
  #chips { display: contents }
  .chip { display: inline-flex; border: 1px solid var(--accent); border-radius: 99px; overflow: hidden }
  .chip button { background: transparent; color: var(--accent); border: 0; font: inherit; padding: 2px 8px; cursor: pointer }
  .flt { flex: 0 0 auto; background: transparent; color: var(--muted); border: 1px solid var(--line); border-radius: 99px; font: inherit; cursor: pointer; padding: 0 8px }
  .chip button:hover, .flt:hover { background: var(--accent); color: var(--accent-ink) }
  summary em { font-style: normal; font-weight: 400; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0 }
  .hide { display: none !important }
  /* editor opened as a full tab (popup.html?tab=ID): page scrolls, header/footer stay sticky */
  body.tab { width: auto; max-width: 960px; margin: 0 auto }
  .tab #body { max-height: none }
  .tab #text { height: calc(100vh - 230px) }
</style>
<header>
  <select id="key"></select>
  <input id="q" type="search" placeholder="ค้นหา เช่น pace, coins">
  <span id="fnav" class="hide"><button id="fprev" class="flt" title="ก่อนหน้า (Shift+Enter)">‹</button><button id="fnext" class="flt" title="ถัดไป (Enter)">›</button></span>
  <label><input id="raw" type="checkbox"> JSON</label>
</header>
<div id="fbar"><input id="fk" list="fkl" placeholder="+ กรองตามค่า… (พิมพ์ค้นหา)"><datalist id="fkl"></datalist><input id="fv" list="fvl" placeholder="ค่า" class="hide"><datalist id="fvl"></datalist><div id="chips"></div></div>
<div id="pbar"><span id="plist"></span><span id="pedit" class="hide"><b id="ppath"></b><select id="pop"><option value="add">+ บวก</option><option value="set">= ตั้งเป็น</option></select><input id="pn" type="number" step="any" placeholder="ค่า"><button id="psave" class="flt">บันทึก preset</button></span></div>
<div id="body"></div>
<div id="tw" class="hide"><div id="hl"></div><textarea id="text" spellcheck="false"></textarea></div>
<footer>
  <div id="tools">
    <button id="export" class="ghost">Export all</button>
    <button id="import" class="ghost">Import</button>
    <button id="popen" class="ghost">Presets ↗</button>
    <button id="topen" class="ghost" title="เปิดเป็นแท็บ: สลับไปดูหน้าอื่นได้โดยไม่เสีย search/ค่าที่แก้">Edit in tab ↗</button>
    <button id="reload" class="ghost" title="อ่านค่าล่าสุดจากหน้าเว็บมาแทนที่ในตัวแก้ไข">↻ โหลดใหม่</button>
    <button id="undo" class="ghost" title="ย้อนการเปลี่ยนแปลงล่าสุด (form mode)">↶ Undo</button>
    <button id="dbtn" class="ghost" title="ดูว่าต่างจากค่าที่บันทึกไว้อย่างไร">Diff</button>
    <button id="restore" class="ghost" title="โหลดค่าก่อน Save ครั้งล่าสุดกลับมา">Backup</button>
    <span id="msg"></span>
  </div>
  <div id="diff" class="hide"></div>
  <input id="file" type="file" accept=".json,application/json" class="hide">
  <div id="actions"><button id="save">Save</button><button id="saveReload">Save &amp; reload</button></div>
</footer>
<script src="shared.js"></script>
<script src="popup.js"></script>
