<!doctype html>
<meta charset="utf-8">
<style>
  :root {
    --bg: #14171c; --card: #1c2027; --line: #2a303a; --text: #e6e9ee; --muted: #8b94a3;
    --accent: #34d399; --accent-ink: #052e1f; --field: #11141a;
    color-scheme: dark;
  }
  * { box-sizing: border-box }
  body { width: 580px; margin: 0; background: var(--bg); color: var(--text); font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif }
  header { display: flex; gap: 8px; align-items: center; padding: 10px; position: sticky; top: 0; z-index: 1; background: var(--bg); border-bottom: 1px solid var(--line) }
  select, input[type=search], input[type=text], input[type=number], textarea {
    background: var(--field); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; font: inherit; outline: none
  }
  select:focus, input:focus, textarea:focus { border-color: var(--accent) }
  header select { flex: 1; min-width: 0; max-width: 200px }
  header input[type=search] { flex: 1; min-width: 0 }
  header label { display: flex; align-items: center; gap: 4px; color: var(--muted); cursor: pointer; white-space: nowrap }
  input[type=checkbox] { accent-color: var(--accent); width: 15px; height: 15px }
  #body { max-height: 430px; overflow: auto; padding: 10px; display: grid; gap: 8px }
  details { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 0 10px }
  details[open] { padding-bottom: 8px }
  summary { cursor: pointer; font-weight: 600; padding: 9px 0; list-style: none; display: flex; align-items: center; gap: 8px }
  summary::before { content: "▸"; color: var(--muted); transition: transform .15s }
  details[open] > summary::before { transform: rotate(90deg) }
  summary small { margin-left: auto; font-weight: 500; color: var(--muted); background: var(--field); border-radius: 99px; padding: 1px 8px }
  .row { display: flex; align-items: center; gap: 10px; padding: 3px 0 }
  .row span { flex: 0 0 180px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
  .row input[type=number], .row input[type=text] { flex: 1; min-width: 0; padding: 4px 8px }
  .row input.name { flex: 0 0 180px; color: var(--muted) }
  .row input[type=number] { text-align: right; font-variant-numeric: tabular-nums }
  .all { background: color-mix(in srgb, var(--accent) 10%, transparent); border-radius: 8px; padding: 6px 8px; margin-bottom: 6px }
  .add { border-top: 1px dashed var(--line); margin-top: 6px; padding-top: 8px }
  .all span { color: var(--accent) }
  .all input { flex: 0 0 90px !important }
  .all button, .add button { background: transparent; color: var(--accent); border: 1px solid var(--accent); border-radius: 8px; padding: 4px 10px; font: inherit; cursor: pointer }
  .all button:hover, .add button:hover { background: var(--accent); color: var(--accent-ink) }
  #text { display: block; width: calc(100% - 20px); height: 430px; margin: 10px; font: 12px/1.5 ui-monospace, Menlo, monospace; resize: none }
  footer { padding: 10px; position: sticky; bottom: 0; background: var(--bg); border-top: 1px solid var(--line) }
  #tools { display: flex; align-items: center; gap: 8px; margin-bottom: 8px }
  #msg { color: var(--muted); font-size: 12px }
  .ghost { background: transparent !important; color: var(--text) !important; border: 1px solid var(--line) !important; width: auto !important; padding: 5px 12px !important; font: 500 12px system-ui !important }
  .ghost:hover { border-color: var(--accent) !important }
  #actions { display: flex; gap: 8px }
  #actions button { flex: 1 }
  footer button { width: 100%; padding: 10px; border: 0; border-radius: 10px; background: var(--accent); color: var(--accent-ink); font: 600 14px system-ui; cursor: pointer }
  footer button:hover { filter: brightness(1.1) }
  #chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 10px 0 }
  .chip, .flt { background: transparent; color: var(--accent); border: 1px solid var(--accent); border-radius: 99px; font: inherit; cursor: pointer }
  .chip { padding: 2px 10px }
  .flt { flex: 0 0 auto; padding: 0 8px; border-color: var(--line); color: var(--muted) }
  .chip:hover, .flt:hover { background: var(--accent); color: var(--accent-ink) }
  .hide { display: none !important }
</style>
<header>
  <select id="key"></select>
  <input id="q" type="search" placeholder="ค้นหา เช่น pace, coins">
  <label><input id="raw" type="checkbox"> JSON</label>
</header>
<div id="chips" class="hide"></div>
<div id="body"></div>
<textarea id="text" class="hide" spellcheck="false"></textarea>
<footer>
  <div id="tools">
    <button id="export" class="ghost">Export all</button>
    <button id="import" class="ghost">Import</button>
    <span id="msg"></span>
  </div>
  <input id="file" type="file" accept=".json,application/json" class="hide">
  <div id="actions"><button id="save">Save</button><button id="saveReload">Save &amp; reload</button></div>
</footer>
<script src="popup.js"></script>
